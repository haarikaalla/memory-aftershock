<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Aftershock</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16201b;
        --muted: #607067;
        --line: #d9e0dc;
        --panel: #fbfcfb;
        --accent: #0f766e;
        --accent-2: #92400e;
        --warn: #b91c1c;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #f5f7f5;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: white;
        padding: 18px 24px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.2;
        letter-spacing: 0;
      }
      main {
        display: grid;
        grid-template-columns: minmax(280px, 380px) 1fr;
        min-height: calc(100vh - 74px);
      }
      aside, section {
        padding: 20px;
      }
      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
      }
      textarea, input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        font: inherit;
        background: white;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        font: inherit;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      button.secondary {
        background: var(--accent-2);
      }
      .stack {
        display: grid;
        gap: 12px;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .memory {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: white;
      }
      .memory strong {
        display: inline-flex;
        min-width: 44px;
      }
      .status-active {
        color: var(--accent);
      }
      .status-needs_review, .status-invalid {
        color: var(--warn);
      }
      pre {
        white-space: pre-wrap;
        background: #101815;
        color: #eaf4ef;
        border-radius: 8px;
        padding: 14px;
        min-height: 160px;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
        }
        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header><h1>Memory Aftershock</h1></header>
    <main>
      <aside class="stack">
        <label class="stack">
          Ask the memory agent
          <textarea id="query" rows="4">What should we recommend for Maya?</textarea>
        </label>
        <div class="toolbar">
          <button id="ask">Ask</button>
          <button class="secondary" id="repair">Repair m0</button>
        </div>
        <pre id="answer"></pre>
      </aside>
      <section class="stack">
        <h2>Memory Store</h2>
        <div id="memories" class="stack"></div>
      </section>
    </main>
    <script>
      async function refresh() {
        const response = await fetch("/memories");
        const memories = await response.json();
        document.querySelector("#memories").innerHTML = memories
          .map((m) => `<div class="memory"><strong>${m.memory_id}</strong><span class="status-${m.status}">${m.status}</span><p>${m.text}</p></div>`)
          .join("");
      }
      document.querySelector("#ask").addEventListener("click", async () => {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ query: document.querySelector("#query").value }),
        });
        document.querySelector("#answer").textContent = JSON.stringify(await response.json(), null, 2);
      });
      document.querySelector("#repair").addEventListener("click", async () => {
        const response = await fetch("/repair", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            root_id: "m0",
            corrected_text: "Maya's current restaurant preference is unknown until verified.",
            budget: 2,
          }),
        });
        document.querySelector("#answer").textContent = JSON.stringify(await response.json(), null, 2);
        await refresh();
      });
      refresh();
    </script>
  </body>
</html>
